name: vistar_employee
description: "Vistar employee app (Android, web preview): Today, leads, calls, inbox, tasks, team floor, attendance."
publish_to: 'none'

# versionName+versionCode. Bump both for every APK uploaded in the Super Admin config section.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  socket_io_client: ^3.1.6
  geolocator: ^14.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  fl_chart: ^1.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  lucide_icons_flutter: ^4.0.1
  timezone: ^0.11.2
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
