org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Low-memory machine (7.8 GB shared by several agents): Kotlin compiles inside the Gradle daemon
# (no second daemon), without incremental caches, and with at most two workers.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.workers.max=2
org.gradle.parallel=false
# Compile SDK 37 (permission_handler_android) is newer than AGP 9.1 tested; it builds fine.
android.suppressUnsupportedCompileSdk=37
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
