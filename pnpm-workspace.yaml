packages:
  - apps/*
  - packages/*

# pnpm 11: dependencies allowed to run install/build scripts.
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - bullmq@6.5.3
  - cron-parser@5.10.3
  - lucide-react@1.66.0
