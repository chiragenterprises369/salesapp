# Vistar CI (change #20): install, build shared, typecheck, lint, unit tests, prisma validate, docker builds.
# No deploy step and no deploy secrets: images are built to check the Dockerfiles, not pushed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  PNPM_VERSION: '11.9.0'
  # Test-only values: never used outside CI.
  NODE_ENV: test
  DATABASE_URL: postgresql://vistar:vistar@localhost:5432/vistar_ci?schema=public
  JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijkl
  JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdefghijk
  SUPER_JWT_SECRET: ci-only-super-secret-0123456789abcdefghijklmn
  ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
  HUB_BACKGROUND_JOBS: 'off'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm build:shared
      - name: Prisma validate and generate
        working-directory: apps/api
        run: pnpm exec prisma validate && pnpm exec prisma generate
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -r typecheck
      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm -r lint
      - name: Unit tests (shared, web, API pure specs)
        run: |
          pnpm --filter @vistar/shared test
          pnpm --filter @vistar/web test
          pnpm --filter @vistar/api exec vitest run src/infra src/common src/modules/documents/pdf src/modules/billing/payment-providers.spec.ts src/modules/packs/pack-installer.spec.ts src/modules/presence/engine
      - name: OpenAPI is up to date
        run: |
          pnpm openapi
          git diff --exit-code -- packages/shared/openapi || (echo "Run pnpm openapi and commit the result" && exit 1)

  api-http:
    # HTTP specs against a real Postgres and Redis (no external providers: mock modes only).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vistar
          POSTGRES_PASSWORD: vistar
          POSTGRES_DB: vistar_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vistar -d vistar_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Migrate and seed
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy && pnpm run seed && pnpm run seed:demo
      - name: API tests
        run: pnpm --filter @vistar/api test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: runtime
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: API tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          target: tools
          push: false
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ci.invalid/api/v1
            NEXT_PUBLIC_WS_URL=https://api.ci.invalid
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Backup image
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          push: false
      - name: Compose file is valid
        run: |
          cp .env.production.example deploy/.env.production
          sed -i 's/^\(JWT_ACCESS_SECRET\|JWT_REFRESH_SECRET\|SUPER_JWT_SECRET\|ENCRYPTION_KEY\|POSTGRES_PASSWORD\|REDIS_PASSWORD\|SEED_SUPER_ADMIN_EMAIL\|SEED_SUPER_ADMIN_PASSWORD\)=$/\1=ci-placeholder/' deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config --quiet
