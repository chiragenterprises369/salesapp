          required:
            - skinTone
            - hairColor
            - hairStyle
            - outfitColor
        workspaceId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type:
            - string
            - "null"
          pattern: ^\+[1-9]\d{6,14}$
        title:
