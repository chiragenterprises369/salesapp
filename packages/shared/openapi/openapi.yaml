                  - leads.create
                  - leads.update
                  - leads.delete
                  - leads.assign
                  - leads.bulk
                  - leads.merge
                  - leads.import
                  - leads.export
                  - pipeline.read
                  - pipeline.manage
                  - tasks.read
                  - tasks.create
                  - tasks.update
                  - tasks.delete
                  - calls.read
                  - calls.make
                  - calls.recordings
                  - messages.read
                  - messages.send
                  - messages.team_inbox
                  - templates.read
                  - templates.manage
                  - workflows.read
