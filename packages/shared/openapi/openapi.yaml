                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                hairColor:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                hairStyle:
                  type: string
                  enum:
                    - short
                    - long
                    - bun
                    - curly
                    - bald
                outfitColor:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
              required:
                - skinTone
                - hairColor
                - hairStyle
                - outfitColor
          required:
            - id
            - name
            - role
            - status
            - avatar
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - status
        - triggerType
        - activeVersion
        - latestVersion
        - draft
        - templateKey
        - stats
        - createdBy
        - createdAt
        - updatedAt
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          type: object
          properties:
            id:
