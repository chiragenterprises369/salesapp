                    schemaVersion:
                      type: number
                      enum:
                        - 1
                      default: 1
                    version:
                      type: integer
                      minimum: 0
                      description: Workflow version number this graph belongs to; 0 = unsaved draft
                    nodes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 64
                          type:
                            type: string
                            enum:
                              - trigger.indiamart_lead
                              - trigger.website_form
                              - trigger.inbound_webhook
                              - trigger.whatsapp_message
                              - trigger.contact_created
                              - trigger.stage_changed
                              - trigger.call_missed
                              - trigger.schedule
                              - action.upsert_contact
                              - action.send_whatsapp_template
                              - action.send_whatsapp_text
                              - action.send_email
                              - action.send_sms
                              - action.create_task
                              - action.create_call_task
                              - action.assign_owner
                              - action.add_tag
                              - action.change_stage
                              - action.update_field
                              - action.outbound_webhook
                              - logic.wait
                              - logic.condition
                              - logic.switch
                              - logic.dedupe
                              - logic.loop_limit
                              - logic.stop
                              - ai.classify_intent
                          position:
                            type: object
                            properties:
                              x:
                                type: number
                              y:
                                type: number
                            required:
                              - x
                              - y
                          data:
                            type: object
                            properties:
                              label:
                                type: string
                                maxLength: 80
                              notes:
                                type: string
                                maxLength: 500
                              config:
                                type: object
                                additionalProperties: {}
                            required:
                              - config
                        required:
                          - id
                          - type
                          - position
                          - data
                      maxItems: 100
                    edges:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 130
                          source:
                            type: string
                          target:
                            type: string
                          sourceHandle:
                            type: string
                            default: out
                          targetHandle:
                            type: string
                            default: in
                        required:
                          - id
                          - source
                          - target
                  required:
                    - version
                    - nodes
                    - edges
                  description: Defaults to the current draft
                leadId:
                  type: string
                  format: uuid
                dummyLead:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 120
                    companyName:
                      type: string
                      maxLength: 160
                    phone:
                      type: string
                      pattern: ^\+[1-9]\d{6,14}$
                    email:
                      type: string
                      format: email
                    city:
                      type: string
                      maxLength: 80
                    state:
                      type: string
                      maxLength: 80
                    source:
                      type: string
                      enum:
