            - id
            - key
            - name
            - kind
            - dataScope
            - permissions
            - isSystem
            - memberCount
        workspace:
          $ref: "#/components/schemas/Workspace"
        permissions:
          type: array
          items:
            type: string
            enum:
              - dashboard.read
              - leads.read
              - leads.create
              - leads.update
              - leads.delete
              - leads.assign
              - leads.bulk
              - leads.merge
              - leads.import
              - leads.export
              - pipeline.read
              - pipeline.manage
              - tasks.read
              - tasks.create
              - tasks.update
              - tasks.delete
              - calls.read
              - calls.make
              - calls.recordings
              - messages.read
              - messages.send
              - messages.team_inbox
              - templates.read
              - templates.manage
              - workflows.read
              - workflows.edit
              - workflows.publish
              - workflows.run
              - webhooks.manage
              - integrations.manage
              - apikeys.manage
              - reports.read
              - teamfloor.read
              - team.read
              - team.manage
              - roles.manage
              - targets.read
              - targets.manage
              - billing.read
              - billing.manage
              - settings.manage
              - audit.read
              - support_access.manage
        teamMemberIds:
          type: array
          items:
            type: string
            format: uuid
        settings:
          type: object
          properties:
            theme:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - system
                    - light
                    - dark
                    - scheduled
                  default: system
                darkFrom:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  default: 19:00
                darkTo:
                  type: string
                  pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  default: 07:00
            teamFloorMode:
              type: string
              enum:
                - auto
                - 3d
                - flat
              default: auto
            notifications:
              type: object
              properties:
                inApp:
                  type: boolean
                  default: true
                push:
                  type: boolean
                  default: true
                emailDigest:
                  type: string
                  enum:
                    - off
                    - daily
                    - weekly
                  default: daily
                muted:
                  type: array
                  items:
                    type: string
                  default: []
            reducedMotion:
              type: string
              enum:
                - system
                - on
                - off
