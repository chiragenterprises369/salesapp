            leadsViewMode:
              type:
                - string
                - "null"
              enum:
                - board
                - table
                - null
              default: null
          required:
            - theme
            - notifications
        impersonation:
          type:
            - object
            - "null"
          properties:
            sessionId:
              type: string
              format: uuid
            adminName:
              type: string
            reason:
              type: string
            readOnly:
              type: boolean
            contentAccess:
              type: boolean
            expiresAt:
              type: string
              format: date-time
          required:
            - sessionId
            - adminName
            - reason
            - readOnly
            - contentAccess
            - expiresAt
      required:
        - user
        - role
        - workspace
        - permissions
        - teamMemberIds
        - settings
        - impersonation
  parameters: {}
paths:
  /api/health:
    get:
      operationId: health
      summary: Health check
      description: "Owner: backend-core. Phase 1."
      tags:
        - system
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  db:
                    type: boolean
                  redis:
                    type: boolean
                  version:
                    type: string
                required:
                  - ok
                  - db
                  - redis
                  - version
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      summary: Sign up and create a workspace
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                workspaceName:
                  type: string
                  minLength: 2
                  maxLength: 80
                timezone:
                  type: string
                  default: Asia/Kolkata
              required:
                - name
                - email
                - password
                - workspaceName
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    description: Seconds until the access token expires
                  me:
                    $ref: "#/components/schemas/MeResponse"
                required:
                  - accessToken
                  - expiresIn
                  - me
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: Log in with email and password
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    description: Seconds until the access token expires
                  me:
                    $ref: "#/components/schemas/MeResponse"
                required:
                  - accessToken
                  - expiresIn
                  - me
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/google:
    post:
      operationId: authGoogle
      summary: Log in or sign up with Google
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idToken:
                  type: string
                  minLength: 10
                  description: Google Identity Services credential
                workspaceName:
                  type: string
                  minLength: 2
                  maxLength: 80
                  description: Required when signing up
                inviteToken:
                  type: string
              required:
                - idToken
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    description: Seconds until the access token expires
                  me:
                    $ref: "#/components/schemas/MeResponse"
                required:
                  - accessToken
                  - expiresIn
                  - me
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      summary: Rotate refresh cookie and issue an access token
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    description: Seconds until the access token expires
                required:
                  - accessToken
                  - expiresIn
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/me:
    get:
      operationId: authMe
      summary: Current user, workspace, permissions and settings
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/invites:
    post:
      operationId: inviteCreate
      summary: Invite by email or create a link
      description: "Requires permission `team.manage`. Owner: backend-core. Phase 1."
      tags:
        - team
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Omit to create a shareable link
                roleId:
                  type: string
                  format: uuid
                  description: System or custom role
                teamId:
                  type: string
                  format: uuid
                expiresInDays:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 7
              required:
                - roleId
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type:
                      - string
                      - "null"
                    format: email
                  roleId:
                    type: string
                    format: uuid
                  roleName:
                    type: string
                  url:
                    type: string
                    format: uri
                    description: Only returned once, at creation
                  expiresAt:
                    type: string
                    format: date-time
                  acceptedAt:
                    type:
                      - string
                      - "null"
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - roleId
                  - roleName
                  - expiresAt
                  - acceptedAt
                  - createdAt
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: inviteList
      summary: Pending invites
      description: "Requires permission `team.manage`. Owner: backend-core. Phase 1."
      tags:
        - team
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type:
                            - string
                            - "null"
                          format: email
                        roleId:
                          type: string
                          format: uuid
                        roleName:
                          type: string
                        url:
                          type: string
                          format: uri
                          description: Only returned once, at creation
                        expiresAt:
                          type: string
                          format: date-time
                        acceptedAt:
                          type:
                            - string
                            - "null"
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - email
                        - roleId
                        - roleName
                        - expiresAt
                        - acceptedAt
                        - createdAt
                required:
                  - items
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/invites/{id}:
    delete:
      operationId: inviteRevoke
      summary: Revoke an invite
      description: "Requires permission `team.manage`. Owner: backend-core. Phase 1."
      tags:
        - team
      security:
        - bearerJwt: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/invites/lookup:
    get:
      operationId: inviteLookup
      summary: Inspect an invite token before accepting
      description: "Owner: backend-core. Phase 1."
      tags:
        - team
      security: []
      parameters:
        - schema:
            type: string
          required: true
          name: token
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaceName:
                    type: string
                  email:
                    type:
                      - string
                      - "null"
                  roleName:
                    type: string
                required:
                  - workspaceName
                  - email
                  - roleName
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/invite/accept:
    post:
      operationId: inviteAccept
      summary: Accept an invite and create the account
      description: "Owner: backend-core. Phase 1."
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 16
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                email:
                  type: string
                  format: email
                  description: Required when the invite has no email (link invite)
              required:
                - token
                - name
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
                    description: Seconds until the access token expires
                  me:
                    $ref: "#/components/schemas/MeResponse"
                required:
                  - accessToken
                  - expiresIn
                  - me
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspace:
    get:
      operationId: workspaceGet
      summary: Workspace profile
      description: "Owner: backend-core. Phase 1."
      tags:
        - workspace
      security:
        - bearerJwt: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: workspaceUpdate
      summary: Update workspace profile, hours, branding
      description: "Requires permission `settings.manage`. Owner: backend-core. Phase 1."
      tags:
        - workspace
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                timezone:
                  type: string
                  description: IANA timezone, default Asia/Kolkata
                businessHours:
                  type: object
                  properties:
                    mon:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    tue:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    wed:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    thu:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    fri:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    sat:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                    sun:
                      type: array
                      items:
                        type: object
                        properties:
                          start:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          end:
                            type: string
                            pattern: ^([01]\d|2[0-3]):[0-5]\d$
                        required:
                          - start
                          - end
                holidays:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      name:
                        type: string
                        minLength: 1
                        maxLength: 80
                    required:
                      - date
                      - name
                logoUrl:
                  type:
                    - string
                    - "null"
                  format: uri
                accentColor:
                  type:
                    - string
                    - "null"
                  pattern: ^#[0-9A-Fa-f]{6}$
                  description: Branding accent; clamped to AA contrast by the UI
                defaultTheme:
                  type: string
                  enum:
                    - system
                    - light
                    - dark
                    - scheduled
                defaultLeadsViewMode:
                  type:
                    - string
                    - "null"
                  enum:
                    - board
                    - table
                    - null
                showEmployeeRank:
                  type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        4XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        5XX:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workspace/theme:
    put:
      operationId: workspaceTheme
      summary: Set the workspace default theme (automation hook)
      description: "Requires permission `settings.manage`. Owner: backend-core. Phase 1."
      tags:
        - workspace
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                    - system
                    - light
                    - dark
                    - scheduled
              required:
                - mode
