openapi: 3.1.0
info:
  title: Vistar API
  version: 0.1.0
  description: Multi-tenant sales management API. All data is scoped to the caller
    workspace. Errors use the ApiError envelope with stable codes.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bearerPlatform:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Super Admin token (audience vistar:platform, 2FA verified).
        Workspace tokens are rejected.
    apiKey:
      type: http
      scheme: bearer
      description: Workspace API key (vst_live_...). Scoped; see API key scopes.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Vistar-Signature
      description: t=<unix>,v1=<hex HMAC-SHA256 of "t.rawBody">
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - NOT_FOUND
                - CONFLICT
                - VERSION_CONFLICT
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
                - AUTH_UNAUTHENTICATED
                - AUTH_INVALID_CREDENTIALS
                - AUTH_TOKEN_EXPIRED
                - AUTH_TOKEN_INVALID
                - AUTH_EMAIL_TAKEN
                - AUTH_INVITE_INVALID
                - AUTH_ACCOUNT_DISABLED
                - FORBIDDEN
                - TENANT_MISMATCH
                - API_KEY_INVALID
                - API_KEY_SCOPE_MISSING
                - LEAD_DUPLICATE
                - LEAD_MERGE_INVALID
                - STAGE_NOT_IN_PIPELINE
                - STAGE_IN_USE
                - IMPORT_INVALID_FILE
                - IMPORT_MAPPING_INVALID
                - CONSENT_OPTED_OUT
                - CONSENT_MISSING
                - WHATSAPP_WINDOW_CLOSED
                - WHATSAPP_TEMPLATE_NOT_APPROVED
                - QUIET_HOURS
                - SEND_RATE_LIMITED
                - INTEGRATION_NOT_CONNECTED
                - INTEGRATION_PROVIDER_ERROR
                - WEBHOOK_SIGNATURE_INVALID
                - WEBHOOK_TIMESTAMP_EXPIRED
                - WEBHOOK_DUPLICATE
                - WEBHOOK_ENDPOINT_DISABLED
                - WORKFLOW_INVALID_GRAPH
                - WORKFLOW_NOT_ACTIVE
                - WORKFLOW_LOOP_LIMIT
                - PLAN_LIMIT_REACHED
            message:
              type: string
              description: Human-readable, safe to show to the user. Never contains PII or
                secrets.
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    description: Dot path of the invalid field, e.g. "contact.phone"
                  message:
                    type: string
                required:
                  - path
                  - message
            requestId:
              type: string
          required:
            - code
            - message
      required:
        - error
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
            - company_admin
            - manager
            - employee
            - viewer
        status:
          type: string
          enum:
            - on_call
            - busy
            - idle
            - away
            - offline
        avatar:
          type:
            - object
            - "null"
          properties:
            skinTone:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            hairColor:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
            hairStyle:
              type: string
              enum:
                - short
                - long
                - bun
                - curly
                - bald
            outfitColor:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
          required:
            - skinTone
            - hairColor
            - hairStyle
            - outfitColor
      required:
        - id
        - name
        - role
        - status
        - avatar
