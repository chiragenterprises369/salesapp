                        - website
                        - whatsapp
                        - manual
                        - webhook
                        - import
                        - api
                      default: manual
                    sourceRef:
                      type: string
                      maxLength: 120
                    productInterest:
                      type: string
                      maxLength: 200
                    requirement:
                      type: string
                      maxLength: 4000
                    ownerId:
                      type: string
                      format: uuid
                    stageId:
                      type: string
                      format: uuid
                      description: Defaults to first stage of default pipeline
                    valueInr:
                      type: integer
                      minimum: 0
                      maximum: 2000000000
                      default: 0
                    tags:
                      type: array
                      items:
                        type: string
                        maxLength: 40
                      maxItems: 30
                      default: []
                    customFields:
                      type: object
                      additionalProperties:
                        anyOf:
                          - type: string
                          - type: number
                          - type: boolean
                          - type: "null"
                      default: {}
                simulateReply:
                  type: string
                  maxLength: 500
                  description: Pretend the lead replied with this text
                waitScale:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0
                  description: 0 = skip waits, 1 = real time
                dryRun:
                  type: boolean
                  default: true
                  description: true = messages are not actually sent
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        4XX:
          description: Error
          content:
